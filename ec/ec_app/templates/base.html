<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">ExpenseTracker</a>
    <div class="d-flex">
      {% if user.is_authenticated %}
      <a href="{% url 'upload' %}" class="btn btn-outline-light btn-sm me-2">Upload</a>
      <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
      {% else %}
      <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
      <a href="{% url 'signup' %}" class="btn btn-success btn-sm">Sign Up</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}
  <!-- Your page-specific content will go here -->
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
